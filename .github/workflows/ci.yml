name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
      - run: uv sync --frozen --dev
      - run: make check
      - run: make audit build
      - name: Installed wheel smoke
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file build/runtime.requirements.txt
          uv venv build/wheel-smoke
          uv pip install --python build/wheel-smoke/bin/python --require-hashes -r build/runtime.requirements.txt
          uv pip install --python build/wheel-smoke/bin/python --no-deps dist/red_five-*.whl
          project_dir="$PWD"
          cd "$RUNNER_TEMP"
          "$project_dir/build/wheel-smoke/bin/red-five" eval "$project_dir/examples/signals.csv" --config "$project_dir/examples/evaluation.json" --analysis-plan "$project_dir/STATISTICAL_ANALYSIS_PLAN.md" --lock "$project_dir/uv.lock" --weights "$project_dir/examples/weights.csv" --output "$project_dir/build/wheel-report.json"
          "$project_dir/build/wheel-smoke/bin/red-five" verify "$project_dir/build/wheel-report.json"
          "$project_dir/build/wheel-smoke/bin/red-five" render "$project_dir/build/wheel-report.json" --output-dir "$project_dir/build/wheel-bundle"
          "$project_dir/build/wheel-smoke/bin/red-five" verify-bundle "$project_dir/build/wheel-bundle"
          "$project_dir/build/wheel-smoke/bin/python" "$project_dir/tools/smoke_sections.py" "$project_dir" "$project_dir/build/wheel-components"
          "$project_dir/build/wheel-smoke/bin/red-five" transfer alignment --forecast "$project_dir/examples/transfer-forecast.json" --covariance "$project_dir/examples/transfer-covariance.json" --config "$project_dir/examples/transfer-config.json" --analysis-plan "$project_dir/docs/TRANSFER_COEFFICIENT_ANALYSIS_PLAN.md" --lock "$project_dir/uv.lock" --output "$project_dir/build/wheel-transfer.json"
          "$project_dir/build/wheel-smoke/bin/red-five" transfer verify "$project_dir/build/wheel-transfer.json"
      - name: Execute synthetic notebook
        run: make notebook-check
      - name: Audit notebook environment
        run: |
          uv audit --preview-features audit-command --locked --only-group notebook
          uv run --frozen --group notebook python tools/check_licenses.py
